    <h1>Operaciones Básicas en JavaScript</h1>

    <script>
 
        let N1 = Number(prompt("Introduce el primer número"));
        let N2 = Number(prompt("Introduce el segundo número"));


        let suma = N1 + N2;
        let resta = N1 - N2;
        let multiplicacion = N1 * N2;
        let division = N1 / N2;

   
        document.write("El valor de la suma es: " + suma + "<br>");
        document.write("El valor de la resta es: " + resta + "<br>");
        document.write("El valor de la multiplicación es: " + multiplicacion + "<br>");
        document.write("El valor de la división es: " + division + "<br>");
    </script>
</body>
</html>
