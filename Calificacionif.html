<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="Estilo.css">
  <title>Promedio if else</title>
</head>
<body>

  <nav class="navbar navbar-custom">
    <div class="container">
      <a href="index.html" class="btn btn-return">Regresar al Menu</a>
    </div>
  </nav>

  <script>
    let cal1 = Number(prompt("Ingresa la primera calificación:"));
    let cal2 = Number(prompt("Ingresa la segunda calificación:"));
    let cal3 = Number(prompt("Ingresa la tercera calificación:"));

    let promedio = (cal1 + cal2 + cal3) / 3;

    if (promedio >= 6) {
      alert("Aprobaste con un promedio de: " + promedio);
    } else {
      alert("Reprobaste con un promedio de: " + promedio);
    }
  </script>
</body>
</html>
